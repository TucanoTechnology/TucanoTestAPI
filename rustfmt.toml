# Rustfmt configuration for TucanoTestAPI.
#
# The project uses rustfmt's default settings, pinned here so a future default
# change does not reformat the codebase silently. `cargo fmt --all -- --check`
# in CI enforces this configuration.
#
# See https://rust-lang.github.io/rustfmt/ for the full list.

edition = "2024"
max_width = 100

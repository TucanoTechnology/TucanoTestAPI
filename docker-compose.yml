services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # A local build name, not a release tag: every `up --build` retags it, so the
    # image the previous container ran loses this name and can be collected. A
    # rollback therefore records the running container's image id and pins it
    # under a rollback-only tag *before* rebuilding — see "Rollback" in
    # docs/deployment/canary-validation-and-rollback.md (audit finding F-178-2).
    image: tucano-test-api:local
    environment:
      TUCANO_DATA_DIR: /data
      PORT: 3000
      # Authentication is on by default for the local stack, so the safe posture
      # is the one the shipped file produces (audit finding F-178-1 in
      # docs/security/audit-s3-container-and-deployment.md). Supply the signing
      # secret and the bootstrap password in a `.env` file next to this file —
      # copy `.env.example` and set them. Set TUCANO_AUTH_REQUIRED to `false`
      # to run anonymously, which is only safe on a single-user machine that
      # nothing else can reach.
      TUCANO_AUTH_REQUIRED: "${TUCANO_AUTH_REQUIRED:-true}"
      # The deadline on the data volume's advisory lock, in milliseconds. See
      # TUCANO_LOCK_TIMEOUT_MS in .env.example.
      TUCANO_LOCK_TIMEOUT_MS: "${TUCANO_LOCK_TIMEOUT_MS:-5000}"
      TUCANO_JWT_SECRET: "${TUCANO_JWT_SECRET:?TUCANO_JWT_SECRET is required and must be at least 32 bytes; copy .env.example to .env and set it}"
      TUCANO_BOOTSTRAP_USERNAME: "${TUCANO_BOOTSTRAP_USERNAME:-admin}"
      TUCANO_BOOTSTRAP_PASSWORD: "${TUCANO_BOOTSTRAP_PASSWORD:?TUCANO_BOOTSTRAP_PASSWORD is required; copy .env.example to .env and set it}"
    ports:
      - "3100:3000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # The service binds a port above 1024, reads and writes a data directory it
    # owns, and writes to its own tmpfs, so it needs no Linux capability at all
    # (audit finding F-178-3 in
    # docs/security/audit-s3-container-and-deployment.md). Drop the default set
    # rather than inherit it; a feature that genuinely needs one adds it back
    # explicitly here.
    cap_drop:
      - ALL
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  gui:
    build:
      context: ../Tucano-Test-GUI
      dockerfile: Dockerfile
    image: tucano-test-gui:local
    environment:
      TUCANO_API_URL: http://api:3000
    ports:
      - "8080:8080"
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

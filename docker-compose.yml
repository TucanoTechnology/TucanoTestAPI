services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tucano-test:local
    environment:
      TUCANO_DATA_DIR: /data
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - tucano-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  tucano-data:
    name: tucano-test-data

name: Lint

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  # A force-push or amended commit supersedes the suite already running for the
  # same pull request, so that one cancels; `main` pushes never cancel each other
  # (docs publishing and provenance must finish in order).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflows:
    name: Validate GitHub Actions syntax
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  contract:
    name: Validate API coverage matrix
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The seed dataset is a fixture, and this is what keeps it a fixture
      # instead of a stale claim: every operation openapi.json publishes has
      # to reach a row in the coverage matrix of
      # docs/testing/seed-dataset-spec.md, or be exempted there with a reason,
      # and every route a row names has to exist. It reads two files and
      # starts nothing, so it is cheap enough to run on every pull request.
      # The seeded half of the freshness check needs a running stack and stays
      # on the local one-command path (scripts/demo.sh) — see the spec's §1.
      - name: Check the coverage matrix against the API contract
        run: node scripts/check-matrix.mjs

  format:
    name: Check formatting
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
      # Shares the cached crates.io downloads with the other container jobs;
      # see the note in the workflows job above and issue #123.
      options: --dns 8.8.8.8 --dns 1.1.1.1
      volumes:
        - tucanotestapi-cargo-registry:/usr/local/cargo/registry
        - tucanotestapi-cargo-git:/usr/local/cargo/git
        - tucanotestapi-rustup:/usr/local/rustup
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install required components
        run: |
          for attempt in 1 2 3 4 5; do
            if rustup component add rustfmt; then
              exit 0
            fi
            delay=$((attempt * 15))
            echo "::warning::rustup component add failed (attempt $attempt/5), retrying in ${delay}s"
            sleep "$delay"
          done
          echo "::error::rustup component add failed after 5 attempts"
          exit 1
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Run clippy
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
      # Shares the cached crates.io downloads with the other container jobs;
      # see the note in the workflows job above and issue #123.
      options: --dns 8.8.8.8 --dns 1.1.1.1
      volumes:
        - tucanotestapi-cargo-registry:/usr/local/cargo/registry
        - tucanotestapi-cargo-git:/usr/local/cargo/git
        - tucanotestapi-rustup:/usr/local/rustup
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install required components
        run: |
          for attempt in 1 2 3 4 5; do
            if rustup component add clippy; then
              exit 0
            fi
            delay=$((attempt * 15))
            echo "::warning::rustup component add failed (attempt $attempt/5), retrying in ${delay}s"
            sleep "$delay"
          done
          echo "::error::rustup component add failed after 5 attempts"
          exit 1
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

name: Build and Test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: build-and-test-${{ github.event.pull_request.number || github.ref }}
  # A force-push or amended commit supersedes the suite already running for the
  # same pull request, so that one cancels; `main` pushes never cancel each other
  # (docs publishing and provenance must finish in order).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rustdoc:
    name: Check rustdoc
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
      # Public resolvers bypass the runner's occasionally-flaky DNS, which has
      # been observed failing lookups for both static.rust-lang.org and
      # static.crates.io. The cargo volumes cache crate downloads (issue #123);
      # the rustup volume caches the toolchain and its rustfmt/clippy components
      # so that only the first run (or a toolchain bump) needs the network.
      options: --dns 8.8.8.8 --dns 1.1.1.1
      volumes:
        - tucanotestapi-cargo-registry:/usr/local/cargo/registry
        - tucanotestapi-cargo-git:/usr/local/cargo/git
        - tucanotestapi-rustup:/usr/local/rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync Rust toolchain
        run: |
          for attempt in 1 2 3 4 5; do
            if rustup show; then
              exit 0
            fi
            delay=$((attempt * 15))
            echo "::warning::rustup sync failed (attempt $attempt/5), retrying in ${delay}s"
            sleep "$delay"
          done
          echo "::error::rustup sync failed after 5 attempts"
          exit 1
      - name: Check rustdoc
        # Intra-doc links and doc-comment warnings are caught before they reach
        # a published crate: a broken link or a missing page is a build failure
        # rather than a silent omission.
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --document-private-items

  test:
    name: Run tests
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
      # Shares the cached crates.io downloads with the other container jobs;
      # see the note in the rustdoc job above and issue #123.
      options: --dns 8.8.8.8 --dns 1.1.1.1
      volumes:
        - tucanotestapi-cargo-registry:/usr/local/cargo/registry
        - tucanotestapi-cargo-git:/usr/local/cargo/git
        - tucanotestapi-rustup:/usr/local/rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync Rust toolchain
        run: |
          for attempt in 1 2 3 4 5; do
            if rustup show; then
              exit 0
            fi
            delay=$((attempt * 15))
            echo "::warning::rustup sync failed (attempt $attempt/5), retrying in ${delay}s"
            sleep "$delay"
          done
          echo "::error::rustup sync failed after 5 attempts"
          exit 1
      - name: Run unit and integration tests
        # Records every request the router serves and then checks that each
        # operation in openapi.json was driven to a successful answer; its first
        # pass is `cargo test --all-targets --all-features`, so this step costs
        # one suite run, not two. The declaration table in tests/service.rs can
        # only prove a covering test exists; this proves it reached the route.
        run: scripts/coverage-check.sh

  release:
    name: Build release
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
      # Shares the cached crates.io downloads with the other container jobs;
      # see the note in the rustdoc job above and issue #123.
      options: --dns 8.8.8.8 --dns 1.1.1.1
      volumes:
        - tucanotestapi-cargo-registry:/usr/local/cargo/registry
        - tucanotestapi-cargo-git:/usr/local/cargo/git
        - tucanotestapi-rustup:/usr/local/rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync Rust toolchain
        run: |
          for attempt in 1 2 3 4 5; do
            if rustup show; then
              exit 0
            fi
            delay=$((attempt * 15))
            echo "::warning::rustup sync failed (attempt $attempt/5), retrying in ${delay}s"
            sleep "$delay"
          done
          echo "::error::rustup sync failed after 5 attempts"
          exit 1
      - name: Build release
        run: cargo build --release

  dependencies:
    name: Check for unused dependencies
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
      # Shares the cached crates.io downloads with the other container jobs;
      # see the note in the rustdoc job above and issue #123.
      options: --dns 8.8.8.8 --dns 1.1.1.1
      volumes:
        - tucanotestapi-cargo-registry:/usr/local/cargo/registry
        - tucanotestapi-cargo-git:/usr/local/cargo/git
        - tucanotestapi-rustup:/usr/local/rustup
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Check for unused dependencies
        # cargo-machete scans the source for imports and flags any dependency
        # listed in Cargo.toml but never referenced. A false positive is
        # acknowledged with `--with-metadata`, which reads the `[package.metadata]`
        # section to exempt intentional entries.
        run: cargo machete --with-metadata

  # Running the shipped image end to end (#419). Every other job here tests
  # compiled code: routers in-process, binaries under `cargo test`. None of
  # them ever asks whether an IMAGE boots — which is precisely the class
  # that broke a real deployment (#355: an unwritable volume was a runtime,
  # image-internal refusal no test could see). This one builds the runtime
  # image, boots it against an empty named volume exactly like a first
  # deploy, waits for /health, and then exercises it as a real HTTP client
  # with the repo's own seed/validate/smoke scripts. It pushes-to-main only:
  # the merge itself is the proof, and the run stays cheap.
  container-smoke:
    name: Container smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime image under test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: tucano-smoke:${{ github.sha }}
          # Same buildx cache scope the container-scan job warms: the image
          # this job runs is the image the scanner just scanned.
          cache-from: type=gha,scope=container-scan
          cache-to: type=gha,mode=max,scope=container-scan
      - name: Boot it against an empty volume, like a first deployment
        run: |
          docker volume create tucano-smoke-${{ github.run_id }}
          # The named volume is seeded from the image at creation, so it
          # arrives owned by the service account (uid 10001) — the real
          # first-deploy condition, not a root-owned accident.
          docker run -d --rm --name tucano-smoke-${{ github.run_id }} \
            --volume tucano-smoke-${{ github.run_id }}:/data \
            --publish 3009:3000 \
            tucano-smoke:${{ github.sha }}
      - name: Wait for /health, and read the boot self-identification (#418)
        run: |
          ready=""
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3009/health >/dev/null 2>&1; then ready=yes; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            docker logs tucano-smoke-${{ github.run_id }} 2>&1 || true
            exit 1
          fi
          logs=$(docker logs tucano-smoke-${{ github.run_id }} 2>&1 | head -n 3)
          echo "$logs"
          echo "$logs" | grep -q 'tucano.boot' \
            || { echo "the boot line must self-identify the build (#418)"; exit 1; }
      - name: Seed, validate and smoke as a real HTTP client
        run: |
          node scripts/seed.mjs http://localhost:3009
          node scripts/validate-seed.mjs http://localhost:3009
          bash scripts/smoke.sh http://localhost:3009
      - name: The compose file still loads as configuration
        run: |
          # Config-parse only: the values are placeholders for the required
          # variable checks, not a deployment.
          TUCANO_JWT_SECRET="container-smoke-placeholder-secret-000" \
          TUCANO_BOOTSTRAP_PASSWORD="container-smoke-placeholder" \
            docker compose --file docker-compose.yml config --quiet
      - name: Tear down
        if: always()
        run: |
          docker rm -f tucano-smoke-${{ github.run_id }} 2>/dev/null || true
          docker volume rm tucano-smoke-${{ github.run_id }} 2>/dev/null || true

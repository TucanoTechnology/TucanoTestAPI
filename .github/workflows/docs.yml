name: Docs

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build documentation
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm
      # Same reasoning as the `build-and-test` job in build-test.yml: without
      # the registry cache this would re-download every crate from
      # static.crates.io, and a refused DNS lookup there fails the job
      # (see issue #123).
      options: --dns 8.8.8.8 --dns 1.1.1.1
      volumes:
        - tucanotestapi-cargo-registry:/usr/local/cargo/registry
        - tucanotestapi-cargo-git:/usr/local/cargo/git
        - tucanotestapi-rustup:/usr/local/rustup
    steps:
      - uses: actions/checkout@v5
      - name: Sync Rust toolchain
        run: |
          for attempt in 1 2 3 4 5; do
            if rustup show; then
              exit 0
            fi
            delay=$((attempt * 15))
            echo "::warning::rustup sync failed (attempt $attempt/5), retrying in ${delay}s"
            sleep "$delay"
          done
          echo "::error::rustup sync failed after 5 attempts"
          exit 1
      # The rust image ships no Node, so the two file-reading checks need one
      # installed before they can run. This is deliberately an apt install
      # rather than actions/setup-node: a container job runs as the image's own
      # root and setup-node's tarball extraction cannot chown to the runner's
      # uid, so it fails with "Cannot change ownership to uid 1001" (see #238).
      - name: Install Node
        run: apt-get update -qq && apt-get install -y -qq nodejs
      # The documentation set is published, so a page cannot go missing or a
      # route list cannot go stale without failing the build. The three checks
      # are the ones the wiki decision record states
      # (docs/architecture/wiki-structure-and-publication.md, "What CI checks"):
      # every relative link resolves and every page is listed in SUMMARY.md and
      # the README table; the operation reference regenerated from openapi.json
      # produces no diff; and the book builds. It reads files and starts
      # nothing, so it is cheap enough to run on every pull request.
      - name: Check documentation links and page listings
        run: node scripts/check-docs-links.mjs
      - name: Check the operation reference is regenerated
        run: node scripts/generate-operations-reference.mjs --check
      # The GitHub Wiki tab is what a reader reaches first, so it is kept in
      # sync with docs/wiki/ — the source of truth — by a build step rather
      # than by hand. This check catches a new page whose name would collide
      # and a cross-page link that no longer has a wiki target before the
      # publish job on main would have to deal with it.
      - name: Check the wiki pages map onto the GitHub Wiki namespace
        run: node scripts/sync-github-wiki.mjs --check
      - name: Install mdBook
        run: cargo install mdbook --locked
      - name: Build the documentation site
        run: mdbook build docs

  publish:
    name: Publish GitHub Wiki
    runs-on: [self-hosted, Linux, X64]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - name: Check whether the wiki token is configured
        id: token
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -n "$WIKI_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WIKI_TOKEN is not set; skipping the GitHub Wiki publish."
          fi
      - name: Stage the wiki pages
        if: steps.token.outputs.available == 'true'
        run: node scripts/sync-github-wiki.mjs --out "$RUNNER_TEMP/wiki"
      - name: Publish to the GitHub Wiki
        if: steps.token.outputs.available == 'true'
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail
          wiki_url="https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          work="$RUNNER_TEMP/wiki-repo"
          # Read access is probed with `git ls-remote`, which never creates a
          # repository as a side effect. A clone that fails does not tell an
          # unauthenticated caller apart from a wiki that has not been created
          # yet — both answer 403/Repository not found (issue #254) — so the
          # two cases are separated here, before anything is pushed:
          #
          #   1. The remote answers, so the token was accepted for read. The
          #      wiki may be empty (unborn HEAD); the commit below seeds it.
          #   2. The remote refuses, so the token is missing, expired, or holds
          #      no access to this repository — report that and stop, instead
          #      of failing on a push whose access error would be hidden behind
          #      the misleading "initialising from scratch" path.
          #
          # A wiki that was never created cannot be seeded from CI: GitHub
          # answers an unauthenticated caller, so giving the token read access
          # is a prerequisite for the first publish, not something the job can
          # work around.
          if git ls-remote "$wiki_url" >/dev/null 2>&1; then
            git clone --depth 1 "$wiki_url" "$work"
            # Remove the predecessors of every mirrored page, so a page
            # dropped from docs/wiki/ is dropped here too and a hand edit
            # in the browser is overwritten rather than merged.
            find "$work" -maxdepth 1 -name '*.md' -delete
          else
            echo "::error::WIKI_TOKEN was refused by $GITHUB_REPOSITORY.wiki.git (403 or not found)." >&2
            echo "The wiki repository is not readable with this token, so the pages cannot be published." >&2
            echo "Check that the token can read the wiki of this repository and has Contents: read and write." >&2
            echo "A wiki that has never been created is not readable either; save any first page in the browser to create it." >&2
            exit 1
          fi
          cp "$RUNNER_TEMP/wiki"/*.md "$work"/
          git -C "$work" config user.name  "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add -A
          if git -C "$work" diff --cached --quiet; then
            echo "The GitHub Wiki is already up to date."
            exit 0
          fi
          git -C "$work" commit -q -m "docs: mirror the wiki from docs/ at ${GITHUB_SHA:0:7}"
          git -C "$work" push -q origin HEAD:master \
            || git -C "$work" push -q origin HEAD:main

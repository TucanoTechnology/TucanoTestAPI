name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    container:
      image: rust:1.98.0-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build devcontainer image
        run: docker build --file .devcontainer/Dockerfile --tag tucano-test-devcontainer .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: tucano-test-devcontainer
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

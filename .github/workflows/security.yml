name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  actions: write

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  secret-scan:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.9.0 detect --source /repo --no-git --redact

  container-scan:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - name: Build application image
        run: docker build --file Dockerfile --tag tucano-test .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tucano-test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  sbom:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        run: cargo cyclonedx --format json > sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

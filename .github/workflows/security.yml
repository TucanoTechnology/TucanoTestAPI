name: Security

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  # A force-push or amended commit supersedes the suite already running for the
  # same pull request, so that one cancels; `main` pushes never cancel each other
  # (docs publishing and provenance must finish in order).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
      # Shares the cached crates.io downloads with the other container jobs so
      # `cargo install cargo-audit` does not have to fetch them again; see the
      # note in the build-and-test job in ci.yml and issue #123.
      options: --dns 8.8.8.8 --dns 1.1.1.1
      volumes:
        - tucanotestapi-cargo-registry:/usr/local/cargo/registry
        - tucanotestapi-cargo-git:/usr/local/cargo/git
        - tucanotestapi-rustup:/usr/local/rustup
        # One persistent volume carries both the installed tool binaries
        # (CARGO_HOME/bin below) and their registry, so the tool compile is
        # paid once per fleet, not once per CI wave (#398). Deliberately a
        # different volume from the crate-source cache, which the build jobs
        # share for a different reason (#123).
        - tucanotestapi-cargo-tools:/cargo
    env:
      # rust-toolchain.toml asks for the rustfmt and clippy components, which
      # this image does not ship, so rustup re-syncs the channel manifest from
      # static.rust-lang.org before the first cargo call. Naming the installed
      # toolchain keeps that call local; this job uses neither component.
      RUSTUP_TOOLCHAIN: "1.98.0"
      CARGO_HOME: /cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-audit
        # Skipped once the tools volume holds the binary (first run pays it).
        run: |
          echo /cargo/bin >> "$GITHUB_PATH"
          [ -x /cargo/bin/cargo-audit ] || cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  secret-scan:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        # Scans the real git history, which is what scanning-policy.md claims:
        # with --no-git gitleaks walked only the checked-out files, so a secret
        # that any later commit deleted was invisible (issue #334). The rules
        # are the pinned image's default set plus the committed `.gitleaks.toml`
        # allow-list — four exact strings, each a human-reviewed synthetic
        # fixture (unit-test constants in src/config/mod.rs, the fake PEM in a
        # policy recipe, one audit-report sentinel); no other value is allowed,
        # in any blob of any commit. The config is committed at the repository
        # v8.30 replaced the old `detect` subcommand with `git`/`dir`; the
        # positional path is required, and the committed `.gitleaks.toml` loads
        # automatically from the scan source. Running the obsolete `detect`
        # against a new image would scan the container's empty workdir and
        # exit 0 — the silent-green this pin discipline exists to avoid, so
        # the CLI contract change is verified with a seeded-history control
        # on every bump (see the #400 review trail). Full history
        # (fetch-depth: 0) is what the scan reads.
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact

  container-scan:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The build is the queue dominator of every CI wave: a cold Dockerfile
      # rebuild costs minutes, and the sources it recompiles rarely change.
      # Build through buildx with the Actions cache backend under a scope of
      # its own — the mechanism release.yml has proven on this fleet (#397) —
      # and load the result into the daemon so trivy still scans the image by
      # name; the CRITICAL/HIGH gate and exit-code policy are unchanged.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: tucano-test
          cache-from: type=gha,scope=container-scan
          cache-to: type=gha,mode=max,scope=container-scan
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tucano-test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  sbom:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
      # Shares the cached crates.io downloads with the other container jobs so
      # `cargo install cargo-cyclonedx` and the dependency resolution behind
      # `cargo cyclonedx` do not have to fetch them again; see the note in the
      # build-and-test job in ci.yml and issue #123.
      options: --dns 8.8.8.8 --dns 1.1.1.1
      volumes:
        - tucanotestapi-cargo-registry:/usr/local/cargo/registry
        - tucanotestapi-cargo-git:/usr/local/cargo/git
        - tucanotestapi-rustup:/usr/local/rustup
        # One persistent volume carries both the installed tool binaries
        # (CARGO_HOME/bin below) and their registry, so the tool compile is
        # paid once per fleet, not once per CI wave (#398). Deliberately a
        # different volume from the crate-source cache, which the build jobs
        # share for a different reason (#123).
        - tucanotestapi-cargo-tools:/cargo
    env:
      # rust-toolchain.toml asks for the rustfmt and clippy components, which
      # this image does not ship, so rustup re-syncs the channel manifest from
      # static.rust-lang.org before the first cargo call. Naming the installed
      # toolchain keeps that call local; this job uses neither component.
      RUSTUP_TOOLCHAIN: "1.98.0"
      CARGO_HOME: /cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-cyclonedx
        run: |
          echo /cargo/bin >> "$GITHUB_PATH"
          [ -x /cargo/bin/cargo-cyclonedx ] || cargo install cargo-cyclonedx --locked
      - name: Generate SBOM
        # cargo-cyclonedx prints nothing: it writes <crate>.cdx.json next to the
        # manifest, so `> sbom.json` captured an empty document and the job
        # published a 0-byte artifact (issue #139). --override-filename names the
        # file instead, and the format supplies the extension.
        run: cargo cyclonedx --format json --override-filename sbom
      - name: Prove the SBOM lists the crate's components
        # The image ships python3, so the document is parsed rather than merely
        # size-checked: a malformed or empty write has to fail the job.
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          sbom = pathlib.Path("sbom.json")
          if not sbom.is_file() or sbom.stat().st_size == 0:
              sys.exit("sbom.json is missing or empty")

          document = json.loads(sbom.read_text(encoding="utf-8"))
          if document.get("bomFormat") != "CycloneDX":
              sys.exit("sbom.json is not a CycloneDX document")

          components = document.get("components") or []
          if not components:
              sys.exit("sbom.json lists no components")

          print(f"sbom.json: CycloneDX {document.get('specVersion')} with {len(components)} components")
          PY
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  # cargo-deny machine-checks the dependency policy asserted in
  # docs/security/scanning-policy.md (#359): advisories from the RustSec database,
  # crates.io-only sources, the SPDX license allow-list, and manifest bans
  # (wildcard requirements denied; version duplicates reviewed, not auto-failed).
  # The advisory half intentionally overlaps cargo-audit — two engines on one
  # database is the supply-chain equivalent of redundant sensors.
  # Coverage-guided fuzzing of the two harnesses that live outside the
  # workspace (#420). The compile gate in build-test.yml keeps them rot-free
  # on every pull; this job puts them to work: a bounded exploration on the
  # weekly schedule, corpus and any crash archived either way. A crash fails
  # the scheduled run, which is the alert path operators already watch — the
  # targets find what the 128-case property suite cannot reach.
  fuzz-run:
    name: Fuzz the harnesses (scheduled)
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
      options: --dns 8.8.8.8 --dns 1.1.1.1
      volumes:
        - tucanotestapi-cargo-registry:/usr/local/cargo/registry
        - tucanotestapi-cargo-git:/usr/local/cargo/git
        - tucanotestapi-rustup:/usr/local/rustup
        # cargo-fuzz itself is a tool compile: paid once per fleet via the
        # shared tools volume (#398).
        - tucanotestapi-cargo-tools:/cargo
    env:
      CARGO_HOME: /cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned nightly and cargo-fuzz
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-09-26
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          if [ ! -x "$CARGO_HOME/bin/cargo-fuzz" ]; then
            cargo install cargo-fuzz --locked
          fi
      - name: Explore the model deserialiser (120 s)
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-09-26
        run: cargo fuzz run deserialize_models -- -max_total_time=120
      - name: Explore the identifier sanitiser (120 s)
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-09-26
        run: cargo fuzz run sanitise_identifiers -- -max_total_time=120
      - name: Archive corpus and any crash artifacts
        if: always()
        run: tar -czf fuzz-state.tar.gz fuzz/corpora fuzz/artifacts 2>/dev/null || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-state-${{ github.run_number }}
          path: fuzz-state.tar.gz
          if-no-files-found: ignore

  deny:
    name: Policy-check dependencies
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
      options: --dns 8.8.8.8 --dns 1.1.1.1
      volumes:
        - tucanotestapi-cargo-registry:/usr/local/cargo/registry
        - tucanotestapi-cargo-git:/usr/local/cargo/git
        - tucanotestapi-rustup:/usr/local/rustup
        # One persistent volume carries both the installed tool binaries
        # (CARGO_HOME/bin below) and their registry, so the tool compile is
        # paid once per fleet, not once per CI wave (#398). Deliberately a
        # different volume from the crate-source cache, which the build jobs
        # share for a different reason (#123).
        - tucanotestapi-cargo-tools:/cargo
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"
      CARGO_HOME: /cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-deny
        run: |
          echo /cargo/bin >> "$GITHUB_PATH"
          [ -x /cargo/bin/cargo-deny ] || cargo install cargo-deny --locked
      - name: Check the dependency graph against deny.toml
        run: cargo deny check advisories bans licenses sources

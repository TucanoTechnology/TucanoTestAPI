name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

jobs:
  lint-workflows:
    name: Validate GitHub Actions syntax
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - name: Validate GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color

  # The seed dataset is a fixture, and this is what keeps it a fixture instead
  # of a stale claim: every operation openapi.json publishes has to reach a row
  # in the coverage matrix of docs/testing/seed-dataset-spec.md, or be exempted
  # there with a reason, and every route a row names has to exist. It reads two
  # files and starts nothing, so it is cheap enough to run on every pull
  # request. The seeded half of the freshness check needs a running stack and
  # stays on the local one-command path (scripts/demo.sh) — see the spec's §1.
  lint-contract:
    name: Validate API coverage matrix
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - name: Check the coverage matrix against the API contract
        run: node scripts/check-matrix.mjs

  # The documentation set is published, so a page cannot go missing or a route
  # list cannot go stale without failing the build. The three checks are the
  # ones the wiki decision record states
  # (docs/architecture/wiki-structure-and-publication.md, "What CI checks"):
  # every relative link resolves and every page is listed in SUMMARY.md and the
  # README table; the operation reference regenerated from openapi.json produces
  # no diff; and the book builds. It reads files and starts nothing, so it is
  # cheap enough to run on every pull request.
  docs:
    name: Validate and build documentation
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm
      # Same reasoning as the `build-and-test` job: without the registry cache this
      # would re-download every crate from static.crates.io, and a refused DNS
      # lookup there fails the job (see issue #123).
      volumes:
        - tucanotestapi-cargo-registry:/usr/local/cargo/registry
        - tucanotestapi-cargo-git:/usr/local/cargo/git
    steps:
      - uses: actions/checkout@v5
      # The rust image ships no Node, so the two file-reading checks need one
      # installed before they can run. This is deliberately an apt install
      # rather than actions/setup-node: a container job runs as the image's own
      # root and setup-node's tarball extraction cannot chown to the runner's
      # uid, so it fails with "Cannot change ownership to uid 1001" (see #238).
      - name: Install Node
        run: apt-get update -qq && apt-get install -y -qq nodejs
      - name: Check documentation links and page listings
        run: node scripts/check-docs-links.mjs
      - name: Check the operation reference is regenerated
        run: node scripts/generate-operations-reference.mjs --check
      # The GitHub Wiki is a mirror of docs/wiki/, so every page must still map
      # onto the flat wiki namespace. This catches a new page whose name would
      # collide, and a cross-page link that no longer has a wiki target, before
      # the publish job on main would have to deal with it.
      - name: Check the wiki pages map onto the GitHub Wiki namespace
        run: node scripts/sync-github-wiki.mjs --check
      - name: Install mdBook
        run: cargo install mdbook --locked
      - name: Build the documentation site
        run: mdbook build docs

  # The GitHub Wiki tab is what a reader reaches first, so it is kept in sync
  # with docs/wiki/ — the source of truth — by a build step rather than by hand.
  # It runs only on main: a pull request stages nothing, and a PR from a fork
  # has no token that could write to the wiki repository. When WIKI_TOKEN is
  # unset the job reports that publishing is skipped instead of failing, so
  # enabling the wiki never blocks a merge.
  wiki:
    runs-on: [self-hosted, Linux, X64]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - name: Check whether the wiki token is configured
        id: token
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -n "$WIKI_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WIKI_TOKEN is not set; skipping the GitHub Wiki publish."
          fi
      - name: Stage the wiki pages
        if: steps.token.outputs.available == 'true'
        run: node scripts/sync-github-wiki.mjs --out "$RUNNER_TEMP/wiki"
      - name: Publish to the GitHub Wiki
        if: steps.token.outputs.available == 'true'
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail
          wiki_url="https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          work="$RUNNER_TEMP/wiki-repo"
          # GitHub creates the wiki repository when its first page is pushed,
          # so it may not exist yet. Three states are possible:
          #
          #   1. Wiki repo exists with commits — shallow clone succeeds.
          #   2. Wiki repo exists but is empty — shallow clone succeeds with
          #      an unborn HEAD; the commit below seeds it.
          #   3. Wiki repo was never created — clone fails with "Repository
          #      not found" (exit 128). In this case we initialise a fresh
          #      repo locally, add the first pages, and push — which creates
          #      the remote wiki repo on GitHub's side.
          #
          # A clone that fails for any *other* reason (bad token, network
          # error) also falls through to the init path, which will fail at
          # the push step with an auth error — distinguishing a genuine
          # access problem from a first-run.
          if git clone --depth 1 "$wiki_url" "$work" 2>/dev/null; then
            # Remove the predecessors of every mirrored page, so a page
            # dropped from docs/wiki/ is dropped here too and a hand edit
            # in the browser is overwritten rather than merged.
            find "$work" -maxdepth 1 -name '*.md' -delete
          else
            echo "Wiki repository does not exist yet; initialising from scratch."
            mkdir -p "$work"
            git -C "$work" init -q
            git -C "$work" remote add origin "$wiki_url"
          fi
          cp "$RUNNER_TEMP/wiki"/*.md "$work"/
          git -C "$work" config user.name  "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add -A
          if git -C "$work" diff --cached --quiet; then
            echo "The GitHub Wiki is already up to date."
            exit 0
          fi
          git -C "$work" commit -q -m "docs: mirror the wiki from docs/ at ${GITHUB_SHA:0:7}"
          git -C "$work" push -q origin HEAD:master \
            || git -C "$work" push -q origin HEAD:main

  build-and-test:
    name: Format, lint, test, and build
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm
      # The container filesystem is thrown away between runs, so without a cache
      # this job re-downloads every crate from static.crates.io each time, and a
      # refused DNS lookup there fails the job (see issue #123). Mounting only
      # the registry and git subdirectories caches the downloads while leaving
      # the image's own cargo and rustc binaries in place.
      volumes:
        - tucanotestapi-cargo-registry:/usr/local/cargo/registry
        - tucanotestapi-cargo-git:/usr/local/cargo/git
    steps:
      - uses: actions/checkout@v5
      - name: Install required components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check rustdoc
        # Intra-doc links and doc-comment warnings are caught before they reach
        # a published crate: a broken link or a missing page is a build failure
        # rather than a silent omission.
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --document-private-items
      - name: Run unit and integration tests
        run: cargo test --all-targets --all-features
      - name: Build release
        run: cargo build --release

  dependency-check:
    name: Check for unused dependencies
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm
      # Shares the cached crates.io downloads with the other container jobs;
      # see the note in the build-and-test job and issue #123.
      volumes:
        - tucanotestapi-cargo-registry:/usr/local/cargo/registry
        - tucanotestapi-cargo-git:/usr/local/cargo/git
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Check for unused dependencies
        # cargo-machete scans the source for imports and flags any dependency
        # listed in Cargo.toml but never referenced. A false positive is
        # acknowledged with `--with-metadata`, which reads the `[package.metadata]`
        # section to exempt intentional entries.
        run: cargo machete --with-metadata

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

jobs:
  workflows:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - name: Validate GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color

  # The seed dataset is a fixture, and this is what keeps it a fixture instead
  # of a stale claim: every operation openapi.json publishes has to reach a row
  # in the coverage matrix of docs/testing/seed-dataset-spec.md, or be exempted
  # there with a reason, and every route a row names has to exist. It reads two
  # files and starts nothing, so it is cheap enough to run on every pull
  # request. The seeded half of the freshness check needs a running stack and
  # stays on the local one-command path (scripts/demo.sh) — see the spec's §1.
  matrix-integrity:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - name: Check the coverage matrix against the API contract
        run: node scripts/check-matrix.mjs

  # The documentation set is published, so a page cannot go missing or a route
  # list cannot go stale without failing the build. The three checks are the
  # ones the wiki decision record states
  # (docs/architecture/wiki-structure-and-publication.md, "What CI checks"):
  # every relative link resolves and every page is listed in SUMMARY.md and the
  # README table; the operation reference regenerated from openapi.json produces
  # no diff; and the book builds. It reads files and starts nothing, so it is
  # cheap enough to run on every pull request.
  docs:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm
      # Same reasoning as the `checks` job: without the registry cache this
      # would re-download every crate from static.crates.io, and a refused DNS
      # lookup there fails the job (see issue #123).
      volumes:
        - tucanotestapi-cargo-registry:/usr/local/cargo/registry
        - tucanotestapi-cargo-git:/usr/local/cargo/git
    steps:
      - uses: actions/checkout@v5
      - name: Check documentation links and page listings
        run: node scripts/check-docs-links.mjs
      - name: Check the operation reference is regenerated
        run: node scripts/generate-operations-reference.mjs --check
      - name: Install mdBook
        run: cargo install mdbook --locked
      - name: Build the documentation site
        run: mdbook build docs

  checks:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: rust:1.98.0-bookworm
      # The container filesystem is thrown away between runs, so without a cache
      # this job re-downloads every crate from static.crates.io each time, and a
      # refused DNS lookup there fails the job (see issue #123). Mounting only
      # the registry and git subdirectories caches the downloads while leaving
      # the image's own cargo and rustc binaries in place.
      volumes:
        - tucanotestapi-cargo-registry:/usr/local/cargo/registry
        - tucanotestapi-cargo-git:/usr/local/cargo/git
    steps:
      - uses: actions/checkout@v5
      - name: Install required components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run unit and integration tests
        run: cargo test --all-targets --all-features
      - name: Build release
        run: cargo build --release

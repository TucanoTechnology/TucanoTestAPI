name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=build-${{ github.run_number }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          build-args: BUILD_NUMBER=${{ github.run_number }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve the published image reference
        id: published
        # The scan has to spell the repository path the way the registry holds
        # it. `github.repository` is the repository's *display* case, while GHCR
        # stores the name lowercase and Trivy's reference parser rejects an
        # uppercase path segment before it reaches the registry at all, so the
        # mixed-case form kills the step with
        # `failed to parse the image name: could not parse reference` and the
        # release goes red without ever auditing the image.
        # docker/metadata-action lowercases the same name when it builds the
        # tags, so this is the reference the push above actually wrote.
        shell: bash
        run: echo "ref=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
      - name: Refuse the scan when the build emitted no digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        # Fail-closed guard for issue #363. The scan below pins exactly the
        # digest this job pushed, so an empty `steps.build.outputs.digest` —
        # a `push:` turned off on the build step, or a build-push-action major
        # that stops emitting `digest` — would degenerate the reference to
        # `ghcr.io/tucanotechnology/tucanotestapi@`, and trivy would fail on
        # an unparseable reference without naming the step that produced it.
        # This step owns the diagnosis: it stops the job before trivy runs,
        # with a message that says the build step published no digest.
        run: |
          if [ -z "$DIGEST" ]; then
            echo "::error::the build step (docker/build-push-action) emitted no digest output — refusing to scan; check that the build pushed and still exposes 'outputs.digest'"
            exit 1
          fi
          echo "scan will pin ${DIGEST}"
      - name: Scan the published digest
        # The gate has to name the artifact a consumer pulls, so it scans the
        # digest this job just pushed rather than the local build the
        # security.yml job scans. The reference joins the lowercase repository
        # path from the step above to the build step's own `digest` output; a
        # mutable tag must never be re-resolved here, because that would let
        # the scan and the push disagree about which image is being gated.
        # Policy is the one security.yml's container-scan uses: CRITICAL/HIGH,
        # unfixed findings ignored, and a non-zero exit code so the release run
        # goes red. The scan runs after the push, so a finding fails the run
        # without withdrawing the digest.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.published.outputs.ref }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        env:
          # trivy-action reaches a private registry through its own credentials
          # (documented for the pinned version); the login step above does not
          # cover this scan on its own.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

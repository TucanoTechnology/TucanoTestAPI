name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
      # only for publishing the release SBOM as a run artifact (#331)
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=build-${{ github.run_number }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: Dockerfile
          build-args: BUILD_NUMBER=${{ github.run_number }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve the published image reference
        id: published
        # The scan has to spell the repository path the way the registry holds
        # it. `github.repository` is the repository's *display* case, while GHCR
        # stores the name lowercase and Trivy's reference parser rejects an
        # uppercase path segment before it reaches the registry at all, so the
        # mixed-case form kills the step with
        # `failed to parse the image name: could not parse reference` and the
        # release goes red without ever auditing the image.
        # docker/metadata-action lowercases the same name when it builds the
        # tags, so this is the reference the push above actually wrote.
        shell: bash
        run: echo "ref=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
      - name: Refuse the scan when the build emitted no digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        # Fail-closed guard for issue #363. The scan below pins exactly the
        # digest this job pushed, so an empty `steps.build.outputs.digest` —
        # a `push:` turned off on the build step, or a build-push-action major
        # that stops emitting `digest` — would degenerate the reference to
        # `ghcr.io/tucanotechnology/tucanotestapi@`, and trivy would fail on
        # an unparseable reference without naming the step that produced it.
        # This step owns the diagnosis: it stops the job before trivy runs,
        # with a message that says the build step published no digest.
        run: |
          if [ -z "$DIGEST" ]; then
            echo "::error::the build step (docker/build-push-action) emitted no digest output — refusing to scan; check that the build pushed and still exposes 'outputs.digest'"
            exit 1
          fi
          echo "scan will pin ${DIGEST}"
      - name: Scan the published digest
        # The gate has to name the artifact a consumer pulls, so it scans the
        # digest this job just pushed rather than the local build the
        # security.yml job scans. The reference joins the lowercase repository
        # path from the step above to the build step's own `digest` output; a
        # mutable tag must never be re-resolved here, because that would let
        # the scan and the push disagree about which image is being gated.
        # Policy is the one security.yml's container-scan uses: CRITICAL/HIGH,
        # unfixed findings ignored, and a non-zero exit code so the release run
        # goes red. The scan runs after the push, so a finding fails the run
        # without withdrawing the digest.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.published.outputs.ref }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        env:
          # trivy-action reaches a private registry through its own credentials
          # (documented for the pinned version); the login step above does not
          # cover this scan on its own.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate the release SBOM
        # The PR/main-push `sbom` job in security.yml proves the crate inventory
        # continuously; this makes the SBOM part of the release itself (#331):
        # the same cargo-cyclonedx generator, run in the same pinned toolchain
        # image (by digest) so the release host keeps no state, sharing the
        # registry cache volume the container jobs already warm.
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -v tucanotestapi-cargo-registry:/usr/local/cargo/registry \
            rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922 \
            bash -c 'cargo install cargo-cyclonedx --locked && cargo cyclonedx --format json --override-filename sbom'
      - name: Prove the SBOM lists the crate's components
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          sbom = pathlib.Path("sbom.json")
          if not sbom.is_file() or sbom.stat().st_size == 0:
              sys.exit("sbom.json is missing or empty")
          document = json.loads(sbom.read_text(encoding="utf-8"))
          if document.get("bomFormat") != "CycloneDX":
              sys.exit("sbom.json is not a CycloneDX document")
          components = document.get("components") or []
          if not components:
              sys.exit("sbom.json lists no components")
          print(f"release SBOM: CycloneDX {document.get('specVersion')} with {len(components)} components")
          PY
      - name: Publish the SBOM with the release
        # The release's public identity is its immutable GHCR tags; there is no
        # GitHub Release object in this repository's model (release numbering
        # policy), so the SBOM is attached to the immutable release *run* — the
        # `build-<run number>` tag and this artifact share that run number as
        # the join key. The generator runs after the digest scan on purpose:
        # an image that fails its vulnerability gate publishes nothing.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-build-${{ github.run_number }}
          path: sbom.json
          retention-days: 90

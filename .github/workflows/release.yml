name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=build-${{ github.run_number }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          build-args: BUILD_NUMBER=${{ github.run_number }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the published digest
        # The gate has to name the artifact a consumer pulls, so it scans the
        # digest this job just pushed rather than the local build the
        # security.yml job scans. The reference is assembled from the build
        # step's own `digest` output; a mutable tag must never be re-resolved
        # here, because that would let the scan and the push disagree about
        # which image is being gated. Policy is the one security.yml's
        # container-scan uses: CRITICAL/HIGH, unfixed findings ignored, and a
        # non-zero exit code so the release run goes red. The scan runs after
        # the push, so a finding fails the run without withdrawing the digest.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
        env:
          # trivy-action reaches a private registry through its own credentials
          # (documented for the pinned version); the login step above does not
          # cover this scan on its own.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

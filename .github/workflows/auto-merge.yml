name: Auto Merge

on:
  workflow_run:
    workflows:
      - Lint
      - Docs
      - Build and Test
      - Security
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge-own-pull-request:
    name: Merge owner pull requests
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: auto-merge-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Merge when every required check has passed
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          # A personal access token belonging to the owner can merge past the
          # required review; the built-in token cannot, but it still beats an
          # unset secret, which fails the step before it runs a single call.
          github-token: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.workflow_run.head_sha;

            // Comment a parked pull request exactly once per (pull request,
            // state): repeat triggers must not spam the thread, and a human
            // must be able to see the stall and its remedy without reading
            // skipped-looking workflow logs (issue #357).
            async function parkWithComment(number, signature, reason) {
              const marker = `<!-- auto-merge-parked:${signature} -->`;
              const pages = github.paginate.iterator(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: number,
                per_page: 100,
              });
              for await (const page of pages) {
                if (page.data.some((c) => (c.body || '').includes(marker))) return;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body:
                  `⏸ **Auto-merge parked.** This pull request is ${reason}. ` +
                  'The merge gate only re-runs when a CI run finishes, so nothing retries this on its own: ' +
                  `bring the branch up to date with \`${info.default_branch}\` (or resolve the reported state) ` +
                  'and the next completed run returns it here.\n' +
                  marker,
              });
            }

            const { data: info } = await github.rest.repos.get({ owner, repo });

            const { data: candidates } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: sha,
              });
            const pr = candidates.find(
              (candidate) =>
                candidate.state === 'open' &&
                candidate.head.repo.full_name === `${owner}/${repo}` &&
                candidate.base.ref === info.default_branch,
            );
            if (!pr) {
              core.info(`No open ${info.default_branch} pull request at ${sha}.`);
              return;
            }
            let permission = 'none';
            try {
              const { data: author } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: pr.user.login,
              });
              permission = author.permission;
            } catch (error) {
              core.info(`Cannot read the permission level of ${pr.user.login} (${error.status}).`);
            }
            if (permission !== 'admin') {
              core.info(
                `#${pr.number} was opened by ${pr.user.login} (${permission}), so it stays blocked until an admin approves it.`,
              );
              return;
            }
            if (pr.draft) {
              core.info(`#${pr.number} is a draft.`);
              return;
            }

            let required = [];
            try {
              const { data: protection } = await github.rest.repos.getBranchProtection({
                owner,
                repo,
                branch: info.default_branch,
              });
              required = protection.required_status_checks?.contexts ?? [];
            } catch (error) {
              // Reading branch protection needs admin, which the built-in token
              // does not have. Every check run on the commit is a stricter gate,
              // and the merge call is rejected anyway if a required one is missing.
              core.info(
                `Cannot read branch protection for ${info.default_branch} (${error.status}); requiring every check run on ${sha} instead.`,
              );
            }

            const { data: checks } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: sha,
              filter: 'latest',
              per_page: 100,
            });
            const latest = new Map(checks.check_runs.map((run) => [run.name, run]));
            // Without branch-protection access (the built-in token's case) every
            // check that reported on the commit has to pass, which is never weaker
            // than the configured required set.
            const names = required.length > 0 ? required : [...latest.keys()];
            const blocking = names.filter((name) => {
              const run = latest.get(name);
              if (!run || run.status !== 'completed') return true;
              return !['success', 'skipped', 'neutral'].includes(run.conclusion);
            });
            if (blocking.length > 0) {
              core.info(`#${pr.number} is still waiting on ${blocking.join(', ')}.`);
              return;
            }

            const { data: state } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pr.number,
            });
            // A behind head is a stall, not a verdict (issue #357). The old
            // behaviour logged an info line and returned; because this job is
            // triggered by a CI run completing and nothing brought the branch
            // up to date, a green owner PR whose base advanced parked forever.
            // 'behind' is fixable automatically, so it is: update the branch,
            // which produces a new head sha, and the workflow run that follows
            // re-enters this gate with the base already included.
            if (state.mergeable_state === 'behind') {
              try {
                await github.rest.pulls.updateBranch({
                  owner,
                  repo,
                  pull_number: pr.number,
                });
                core.info(
                  `#${pr.number} was behind ${info.default_branch}; updated the branch — the merge will be retried by the run on the new head sha.`,
                );
              } catch (error) {
                await parkWithComment(
                  pr.number,
                  'behind-update-failed',
                  `behind \`${info.default_branch}\`, and the automatic branch update was refused (${error.message}) — update or rebase the branch by hand`,
                );
                core.info(`#${pr.number}: update-branch refused (${error.message}).`);
              }
              return;
            }
            if (state.mergeable !== true) {
              if (state.mergeable === null) {
                // GitHub is still computing mergeability; any later completed
                // run of the watched workflows re-enters this gate with the
                // settled value, so this one state stays an info line.
                core.info(`#${pr.number} is still being evaluated for mergeability.`);
                return;
              }
              // A settled state no run can clear on its own (a conflicting
              // 'dirty', a 'blocked' review, …): say so on the pull request
              // itself, not just in this log (issue #357).
              await parkWithComment(
                pr.number,
                state.mergeable_state,
                `not mergeable (state \`${state.mergeable_state}\`)`,
              );
              core.info(`#${pr.number} is not mergeable (${state.mergeable_state}).`);
              return;
            }

            try {
              const { data: merged } = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: 'merge',
              });
              core.info(`#${pr.number}: ${merged.message}`);
            } catch (error) {
              // A token without admin rights cannot satisfy the required review,
              // so a still-blocked merge is expected here rather than a failure.
              core.info(`#${pr.number} cannot be merged yet: ${error.message}`);
            }

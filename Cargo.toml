[package]
name = "tucano-test"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["limit", "trace"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"